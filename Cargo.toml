[workspace]
members = ["classfile", "java_runtime", "jvm", "jvm_rust", "test_utils"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dlunch/RustJava"

[workspace.dependencies]
anyhow = { version = "^1.0", default-features = false }
async-recursion = { version = "^1.0", default-features = false }
async-trait = { version = "^0.1", default-features = false }
bytemuck = { version = "^1.25", default-features = false, features = ["extern_crate_alloc"] }
dyn-clone = { version = "^1.0", default-features = false }
dyn-hash = { version = "^1.0", default-features = false }
hashbrown = { version = "^0.17", features = ["default-hasher"], default-features = false }
nom = { version = "^8.0", default-features = false, features = ["alloc"] }
parking_lot = { version = "^0.12", default-features = false }
tracing = { version = "^0.1", default-features = false, features = ["attributes"] }

tokio = { version = "^1.52", features = ["macros"] }

classfile = { path = "classfile", version = "0.1.1" }
java_class_proto = { path = "java_class_proto", version = "0.1.1" }
java_constants = { path = "java_constants", version = "0.1.1" }
java_runtime = { path = "java_runtime", version = "0.1.1" }
jvm = { path = "jvm", version = "0.1.1" }
jvm_rust = { path = "jvm_rust", version = "0.1.1" }
test_utils = { path = "test_utils", version = "0.1.1" }

[package]
name = "rust_java"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rust_java"

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

jvm = { workspace = true }
jvm_rust = { workspace = true }
java_class_proto = { workspace = true }
java_runtime = { workspace = true }

[dev-dependencies]
test_utils = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
